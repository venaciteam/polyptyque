name: Plugin Stream Deck

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Tests et paquet de développement en local ; GitHub pour les publications
# ou une vérification manuelle, pas pour chaque correction poussée.

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streamdeck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: streamdeck/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:ui
        env:
          POLYPTYQUE_TEST_BROWSER: chromium
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: Polyptyque-StreamDeck-beta
          path: livraison/city.vena.polyptyque.streamDeckPlugin
          if-no-files-found: error
