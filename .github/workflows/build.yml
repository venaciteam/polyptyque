name: Fabrication

on:
  push:
  pull_request:
  workflow_dispatch:

# Fabrication seule : vérification du code et tests se lancent en local,
# sous Windows, avant chaque publication.
# Publication d'une version (étiquette « v1.2.3 ») : création de la page de
# version GitHub, d'où Polyptyque télécharge ses mises à jour.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # FFmpeg 8.1 : en-têtes NVIDIA SDK 13.0, compatibles avec les pilotes 570+.
  # Les versions 9.x exigent des pilotes 610+.
  FFMPEG_ZIP: ffmpeg-n8.1-latest-win64-gpl-8.1
  FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-8.1.zip
  # Installateur : même version que la bibliothèque velopack de l'application.
  VPK_VERSION: 1.2.161
  # Dossier d'installation : %LOCALAPPDATA%\PolyptyqueApp, distinct des données
  # (%LOCALAPPDATA%\Polyptyque, %APPDATA%\Polyptyque), qu'une désinstallation
  # ne touche donc pas.
  PACK_ID: PolyptyqueApp

jobs:
  windows:
    name: Fabrication Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Outils
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      # Bibliothèques externes déjà compilées, gardées d'une fabrication à
      # l'autre. Jamais pour une publication : la version publiée est
      # fabriquée entièrement.
      - uses: Swatinem/rust-cache@v2
        if: github.ref_type != 'tag'
      - name: Compilation
        run: cargo build --release -p polyptyque-app -p polyptyque-cli
      - name: Téléchargement de FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:FFMPEG_URL -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
      - name: Assemblage
        shell: pwsh
        run: |
          $dist = "dist/Polyptyque"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item target/release/polyptyque.exe $dist/
          Copy-Item target/release/polyptyque-cli.exe $dist/
          Copy-Item "ffmpeg/$env:FFMPEG_ZIP/bin/ffmpeg.exe" $dist/
          Copy-Item "ffmpeg/$env:FFMPEG_ZIP/LICENSE.txt" "$dist/FFMPEG-LICENSE.txt"
          Copy-Item LICENSE "$dist/LICENSE.txt"
          Copy-Item packaging/LISEZMOI.txt $dist/
          Copy-Item packaging/README.txt $dist/
          & "$dist/ffmpeg.exe" -hide_banner -version | Select-Object -First 1
          & "$dist/ffmpeg.exe" -hide_banner -encoders | Select-String -Pattern "nvenc|amf|qsv|libx264"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Installateur
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet tool update -g vpk --version $env:VPK_VERSION
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append
          $version = ((cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq "polyptyque-app").version
          # Une version à tiret (« 1.0.0-beta.1 ») est une bêta : publiée comme
          # préversion GitHub, proposée seulement aux copies réglées sur
          # « Versions stables et bêta ».
          $core, $suffix = $version.Split('+')[0].Split('-', 2)
          $beta = [bool]$suffix
          $numbers = $core.Split('.')
          $title = "Polyptyque $($numbers[0]).$($numbers[1])"
          if ($numbers[2] -ne '0') { $title += ".$($numbers[2])" }
          # Titre de la page en anglais, langue de tête du dépôt (« Polyptyque
          # 1.0 beta 5 ») ; les notes sont en anglais puis en français.
          if ($suffix -match '^beta\.(\d+)$') { $title += " beta $($Matches[1])" } elseif ($beta) { $title += " $suffix" }
          $notes = "packaging/notes/v$version.md"
          Write-Host "Version $version, page « $title », bêta : $beta, notes : $(Test-Path $notes)"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BETA=$beta" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TITLE=$title" | Out-File -FilePath $env:GITHUB_ENV -Append
          # Options facultatives, en listes : PowerShell transformerait une
          # liste d'un seul élément en simple texte, passé lettre par lettre.
          $pre = @()
          if ($beta) { $pre += '--pre' }
          $releaseNotes = @()
          if (Test-Path $notes) { $releaseNotes += '--releaseNotes', $notes }
          $repo = "https://github.com/${{ github.repository }}"
          if ("${{ github.ref_type }}" -eq "tag") {
            if ("${{ github.ref_name }}" -ne "v$version") {
              throw "L'étiquette ${{ github.ref_name }} ne correspond pas à la version $version (Cargo.toml)."
            }
            if (-not (Test-Path $notes)) { throw "Notes de version manquantes : $notes" }
            # Version précédente : permet des mises à jour partielles, plus légères.
            vpk download github --repoUrl $repo --token $env:GITHUB_TOKEN --outputDir releases @pre
          }
          vpk pack --packId $env:PACK_ID --packVersion $version --packDir dist/Polyptyque `
            --mainExe polyptyque.exe --packTitle Polyptyque --packAuthors Polyptyque `
            --icon assets/logo/polyptyque.ico --splashImage assets/logo/installation.gif `
            --runtime win10.0.19041-x64 @releaseNotes --outputDir releases
          if ($LASTEXITCODE -ne 0) { throw "vpk pack a échoué" }
          Get-ChildItem releases
          New-Item -ItemType Directory -Force -Path livraison | Out-Null
          Copy-Item "releases/$env:PACK_ID-win-Setup.exe" livraison/Polyptyque-Setup.exe
          Copy-Item "releases/$env:PACK_ID-win-Portable.zip" livraison/Polyptyque-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Polyptyque-windows
          path: livraison/
          retention-days: 30
      - name: Publication de la version
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $pre = @()
          if ($env:BETA -eq 'True') { $pre += '--pre' }
          vpk upload github --repoUrl "https://github.com/${{ github.repository }}" --token $env:GITHUB_TOKEN `
            --outputDir releases --tag "v$env:VERSION" --releaseName "$env:TITLE" --publish @pre
          if ($LASTEXITCODE -ne 0) { throw "publication échouée" }
          # Installateur et version portable sous les noms du README. La mise
          # à jour automatique n'utilise que les paquets (.nupkg) et
          # releases.win.json, qui gardent leur nom.
          gh release upload "v$env:VERSION" livraison/Polyptyque-Setup.exe livraison/Polyptyque-portable.zip `
            --repo "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { throw "envoi de l'installateur et de la version portable échoué" }
          foreach ($asset in "$env:PACK_ID-win-Setup.exe", "$env:PACK_ID-win-Portable.zip") {
            gh release delete-asset "v$env:VERSION" $asset --repo "${{ github.repository }}" --yes
            if ($LASTEXITCODE -ne 0) { throw "suppression de $asset échouée" }
          }
