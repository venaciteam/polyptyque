[package]
name = "polyptyque-cli"
description = "Mode commande de Polyptyque : pilotage par d'autres programmes (sorties JSON, serveur MCP)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "polyptyque-cli"
path = "src/main.rs"

[dependencies]
polyptyque-core.workspace = true
serde_json.workspace = true
sys-locale.workspace = true
tr.workspace = true

[target.'cfg(windows)'.dependencies]
polyptyque-windows.workspace = true

[build-dependencies]
embed-resource = "3.0"
