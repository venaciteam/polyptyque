[package]
name = "polyptyque-app"
description = "Interface graphique de Polyptyque"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[[bin]]
name = "polyptyque"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
log.workspace = true
polyptyque-core.workspace = true
polyptyque-engine.workspace = true
simplelog.workspace = true
slint = { version = "1.18", features = ["raw-window-handle-06"] }
serde_json.workspace = true
json5 = "0.4"
serde_yaml_ng = "0.10"
toml_edit = "0.25"
toml.workspace = true
sys-locale.workspace = true
tr.workspace = true

[target.'cfg(windows)'.dependencies]
arboard = { version = "3.7", default-features = false }
polyptyque-windows.workspace = true
raw-window-handle = "0.6"
rfd = { version = "0.17", default-features = false }
velopack = "1.2"

[build-dependencies]
embed-resource = "3.0"
slint-build = "1.18"

[dev-dependencies]
# Lecture des catalogues de traduction (test tests/catalogue.rs).
rspolib.workspace = true
