[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "1.0.0-beta.7"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/venaciteam/Polyptyque"
rust-version = "1.85"

[workspace.dependencies]
polyptyque-core = { path = "crates/polyptyque-core" }
polyptyque-engine = { path = "crates/polyptyque-engine" }
polyptyque-windows = { path = "crates/polyptyque-windows" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
crossbeam-channel = "0.5"
directories = "6"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simplelog = "0.12"
toml = "1"
rspolib = "0.1"
sys-locale = "0.3"
tr = { version = "0.1.11", default-features = false }
wasapi = "0.26"
windows = "0.62"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
